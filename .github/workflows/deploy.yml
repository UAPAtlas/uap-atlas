name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify deterministic generated artifacts
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check -r requirements-build.txt
          npm run verify:build
          python3 scripts/build-image-derivatives.py --check
          python3 scripts/build-source-availability.py
          git diff --exit-code -- source-availability.json source-availability.js
          python3 scripts/test-repository-hygiene.py
      - name: Validate Atlas data and runtime contracts
        run: |
          python3 validate_atlas.py
          python3 scripts/test-atlas-health-contract.py
          python3 scripts/test-atlas-payload-contract.py
          python3 scripts/test-blackfile-mode.py
          python3 scripts/test-atlas-product-integrity.py
          node scripts/test-atlas-single-entry.mjs
          node scripts/test-atlas-navigation-contract.mjs index.html index.html
          node scripts/test-source-availability-contract.mjs
          node scripts/test-evidence-lens.mjs
          node scripts/test-orbital-evidence-architecture.mjs
          python3 scripts/test-atlas-runtime-data-sync.py
          python3 scripts/test-audit-operational-triage.py
          python3 scripts/test-selective-primary-record-quality.py
          python3 scripts/test-blackfile-boundary-queue-calibration.py
          python3 scripts/test-public-acquisition-integration.py
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Build site artifact
        run: |
          mkdir -p /tmp/site
          # Copy web-facing files only (exclude large binaries)
          rsync -av \
            --exclude-from='assets/image-derivatives-exclude.txt' \
            --include='assets/evidence/GHOSTROCKETS-1946/mapped-pdfs/*.pdf' \
            --include='assets/evidence/NIMITZ-2004/NIMITZ-2004-executive-summary.pdf' \
            --include='assets/evidence/LAJOYA-1980/LAJOYA-1980-DIA-JCS-message.pdf' \
            --include='assets/evidence/CIA-UAP-014-BRITISH/CIA-UAP-014_British_Activity_in_the_Field_of_Unidentified_Flying_Objects.pdf' \
            --include='assets/evidence/CIA-UAP-018-USSR/CIA-UAP-018_Report_of_Unusual_Flying_Object_Sightings_and_Attendant_Scientific_Activity.pdf' \
            --exclude='*.pdf' \
            --exclude='*.mp4' \
            --exclude='*.webm' \
            --exclude='*.txt' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='workbench' \
            --exclude='__pycache__' \
            --exclude='qa' \
            --exclude='research' \
            --exclude='source-files' \
            --exclude='scripts' \
            ./ /tmp/site/
          python3 scripts/test-atlas-artifact-budget.py --root /tmp/site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v5
